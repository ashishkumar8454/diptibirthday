<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐼 Cute Panda Surprise! 🎁</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="music-controller-group">
    <button class="music-controller" id="prevSongBtn" title="Previous Song">⏮️</button>
    <button class="music-controller" id="musicToggle" title="Play / Pause">🎵</button>
    <button class="music-controller" id="nextSongBtn" title="Next Song">⏭️</button>
</div>
<audio id="bgMusic" src="music/song1.mp3"></audio>

<section id="pandaPage">
    <div class="glass">
        <h2>I Knew You Would Say YES ❤️</h2>
        <p>So I called two cute pandas... They also brought a birthday cake for you! 🐼🎂</p>
        <div class="panda-wrapper">
            <img src="assets/boy-panda.jfif" alt="Boy Panda" class="boyPanda panda-pop">
            <div class="gift">🎁</div>
            <img src="assets/girl-panda.avif" alt="Girl Panda" class="girlPanda panda-pop">
        </div>
        <p>Let's blow the candles and cut your cake! 🎂✨</p>
        <a href="cake.html" class="btn">Cut Birthday Cake 🎂</a>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
