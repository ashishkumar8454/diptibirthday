<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✉️ A Special Letter For You ✨</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>

<!-- FLOATING MULTI-SONG CONTROLLER -->
<div class="music-controller-group">
    <button class="music-controller" id="prevSongBtn" title="Previous Song">⏮️</button>
    <button class="music-controller" id="musicToggle" title="Play / Pause">🎵</button>
    <button class="music-controller" id="nextSongBtn" title="Next Song">⏭️</button>
</div>
<audio id="bgMusic" src="music/song1.mp3"></audio>

<section id="letterPage">
    <!-- ENVELOPE WRAPPER (PREMIUM 3D ENVELOPE) -->
    <div class="envelope-wrapper" id="envelope">
        <div class="envelope-flap"></div>
        <div class="wax-seal">❤️</div>
        <div class="envelope-text">
            For Dipti 💌
            <span>Tap to Open Your Letter ✨</span>
        </div>
    </div>

    <!-- FLORAL PARCHMENT LETTER PAPER -->
    <div class="letter-paper hidden" id="letterPaper">
        <!-- FLORAL CORNER DECORATIONS -->
        <div class="floral-corner top-left">🌸</div>
        <div class="floral-corner top-right">🌹</div>
        <div class="floral-corner bottom-left">🌹</div>
        <div class="floral-corner bottom-right">🌸</div>

        <!-- WAX SEAL STAMP -->
        <div class="wax-seal-top">❤️</div>
        
        <!-- TYPEWRITER TEXT CONTAINER -->
        <div id="typewriterLetter"></div>
        
        <div class="letter-footer-signature hidden" id="letterSignature">
            With Best Wishes ❤️<br>
            <span class="sig-name">Ashish</span>
        </div>

        <a href="index.html" class="btn hidden" id="watchAgainBtn" style="margin-top: 25px;">Replay Magic 🎉</a>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
